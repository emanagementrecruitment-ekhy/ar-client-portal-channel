name: Build Android App (TWA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # GitHub's ubuntu-latest image already ships a full Android SDK.
        run: |
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          : "${ANDROID_SDK_ROOT:=$ANDROID_HOME}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "Resolved ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools/latest/bin"

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: Bridge Android SDK layout for Bubblewrap compatibility
        run: ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Restore signing keystore
        working-directory: android
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Point Bubblewrap at the JDK/Android SDK installed above
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Generate the Android project from twa-manifest.json
        working-directory: android
        run: |
          for attempt in 1 2 3; do
            bubblewrap update --skipVersionUpgrade 2>&1 | tee update-output.log
            if [ -f manifest-checksum.txt ] && [ -f gradlew ]; then
              break
            fi
            echo "Attempt $attempt did not produce a valid project, retrying in 15s..."
            sleep 15
          done
          test -f manifest-checksum.txt && test -f gradlew

      - name: Build signed App Bundle + APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          bubblewrap build --skipPwaValidation 2>&1 | tee build-output.log
          test -f app-release-bundle.aab
          test -f app-release-signed.apk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-portal-android-${{ github.run_number }}
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
          retention-days: 90

      - name: Publish APK for in-app download
        # Copies the freshly built APK into the Next.js public/ folder and
        # commits it back to main under a fixed filename, so the live site
        # always serves the latest build at a stable URL. This path is
        # outside android/**, so it doesn't retrigger this workflow.
        run: |
          mkdir -p public/downloads
          cp android/app-release-signed.apk public/downloads/client-portal.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/downloads/client-portal.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to publish."
          else
            git commit -m "Publish APK terbaru ke /downloads (auto dari CI build #${{ github.run_number }})"
            git pull --rebase origin main
            git push
          fi
